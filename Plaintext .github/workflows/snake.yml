name: generate animation

on:
  # Her 12 saatte bir otomatik çalışır (UTC)
  schedule:
    - cron: "0 */12 * * *"
  
  # Manuel olarak tetiklenebilir
  workflow_dispatch:
  
  # main branch'ine push yapıldığında çalışır
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # SVG oluşturmak için github-user-contribution-grid-snake action'ı kullanılır
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Oluşturulan SVG dosyaları output branch'ine push edilir
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

